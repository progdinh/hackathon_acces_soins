# Neutralisation du lexique (v2/docs/lab/lexicon.md) : terme jugeant -> formulation neutre.
neutralisation:
  - {terme: desert medical, neutre: territoire à accès moindre (densité inférieure à la moyenne)}
  - {terme: deserts medicaux, neutre: territoires à accès moindre (densité inférieure à la moyenne)}
  - {terme: mediocre, neutre: moindre (que la moyenne nationale ou régionale)}
  - {terme: mauvais, neutre: moindre (que la moyenne)}
  - {terme: penurie, neutre: écart entre l'offre projetée et les besoins projetés}
  - {terme: manque, neutre: écart entre l'offre projetée et les besoins projetés}
  - {terme: sur dotee, neutre: à densité supérieure à la moyenne}
  - {terme: sur dotees, neutre: à densité supérieure à la moyenne}
  - {terme: sur dote, neutre: à densité supérieure à la moyenne}
  - {terme: sous dotee, neutre: à densité inférieure à la moyenne}
  - {terme: sous dotees, neutre: à densité inférieure à la moyenne}
  - {terme: trop de professionnels, neutre: densité supérieure à la moyenne}
  - {terme: catastrophique, neutre: la densité diminue de X % d'ici l'horizon (chiffre à lire dans la projection)}
  - {terme: critique, neutre: la densité diminue de X % d'ici l'horizon (chiffre à lire dans la projection)}
  - {terme: alarmante, neutre: la densité diminue de X % d'ici l'horizon (chiffre à lire dans la projection)}
  - {terme: abandonnes, neutre: où la densité a le plus baissé}
  - {terme: oublies, neutre: où la densité a le plus baissé}
  - {terme: mauvais eleve, neutre: en dessous de la moyenne}
  - {terme: bon eleve, neutre: au-dessus de la moyenne}
  - {terme: echec, neutre: effet projeté de +/− N professionnels}
  - {terme: il faut, neutre: le scénario X conduit à …}
  - {terme: doivent, neutre: le scénario X conduit à …}
  - {terme: on doit, neutre: le scénario X conduit à …}
  - {terme: prevision, neutre: projection sous hypothèses}

# Politiques reconnues mais absentes du jumeau, avec la raison.
non_modelises:
  obligation_zone:
    libelle: Obligation d'exercice en zone sous-dotée
    termes: [obligation d exercer, obligation d exercice, obligation d installation, zone sous dotee,
             zones sous dotees, exercer en zone, affectation obligatoire]
    raison: "Le jumeau n'a pas de flux d'affectation contrainte des jeunes diplômés ; la régulation « un départ pour une arrivée » est le seul levier d'installation modélisé."
    source: null
  exercice_coordonne:
    libelle: Maisons et centres de santé, exercice coordonné
    termes: [maison de sante, maisons de sante, msp, centre de sante, centres de sante, exercice coordonne, cpts]
    raison: "Le jumeau ne distingue pas le mode d'exercice coordonné et n'a pas d'effet estimé d'une maison de santé sur l'installation ou le départ des professionnels."
    source: null
  remuneration:
    libelle: Rémunération, tarifs et honoraires
    termes: [salaire, salaires, remuneration, remunerations, revaloriser, revalorisation, honoraires, tarifs,
             tarif, cotation, cotations, grille salariale, primes de salaire]
    raison: "Le jumeau n'estime aucune élasticité des installations, des départs ou des entrées en formation à la rémunération."
    source: null
  duree_etudes:
    libelle: Durée des études (année d'internat ou de formation supplémentaire)
    termes: [internat, annee d internat, annee supplementaire d internat, allongement des etudes, duree des etudes,
             annee de formation supplementaire, docteur junior]
    raison: "Le jumeau ne modélise pas la durée des études : seul le délai entre une hausse des places et les premiers diplômés est pris en compte."
    source: null
  aides_installation:
    libelle: Aides ou primes à l'installation
    termes: [aide au logement, aides au logement, logement, logements, logement etudiant, euros, bourse, bourses, allocation, exoneration fiscale,
             prime a l installation, primes a l installation, aide a l installation, aides a l installation,
             contrat d aide, incitations financieres, prime, primes, exoneration]
    raison: "Aucune élasticité de l'installation aux aides financières n'est estimée sur données ouvertes ; le jumeau ne relie pas un montant en euros à un flux."
    source: null
  cesp:
    libelle: Contrat d'engagement de service public (CESP)
    termes: [cesp, contrat d engagement de service public]
    raison: "Concerne surtout les étudiants en médecine (hors périmètre) et les dentistes ; pas de flux CESP dans le jumeau."
    source: "Code de l'éducation, art. L632-6 (CESP)"
  vaccination_officine:
    libelle: Vaccination en officine et autres transferts de tâches
    termes: [vacciner, vaccination, vaccinent, transfert de taches, transferts de taches, delegation de taches,
             nouvelles missions, prescription par le pharmacien, protocoles de cooperation]
    raison: "Effectif inchangé dans le modèle : un transfert de tâches ne change pas le nombre de professionnels projeté. La vaccination en officine est calculée sur la couverture de la demande adressée aux pharmaciens ; les autres transferts ne le sont pas."
    source: "v2/docs/lab/fiches/param-besoin-l23-vaccination.md"
  ipa:
    libelle: Infirmiers en pratique avancée (IPA)
    termes: [pratique avancee, ipa, infirmiers en pratique avancee]
    raison: "Effectif inchangé dans le modèle (les IPA ne sont pas distingués dans les effectifs). L'accès direct aux IPA (L25) est non mesurable : aucun volume d'actes en accès direct publié, expérimentation en CPTS ouverte le 1er décembre 2026 (fiche param-besoin-l25-ipa) ; pas de couverture calculée."
    source: "Code de la santé publique, art. L4301-1 (exercice en pratique avancée)"
  acces_direct:
    libelle: Accès direct (kiné, IPA, orthophoniste…)
    termes: [acces direct, sans prescription, sans ordonnance]
    raison: "Effectif inchangé dans le modèle. L'accès direct au kiné (L27) est non mesurable sauf k = 0 : ni volume de séances en accès direct ni part des consultations de MG prescriptrices publiés (fiche param-besoin-l27-kine) ; pas de couverture calculée."
    source: "Loi n° 2023-379 du 19 mai 2023 portant amélioration de l'accès aux soins par la confiance aux professionnels de santé"
  tension_diabete:
    libelle: Prise de tension et dépistage du diabète en officine
    termes: [prise de tension, prennent la tension, prendre la tension, mesurer la tension, mesure de la tension, tension arterielle,
             pression arterielle, hypertension, depistage du diabete, depistent le diabete, depister le diabete, glycemie, diabete]
    raison: "Effectif inchangé dans le modèle. Transfert non mesurable : aucun acte facturable connu au 2026-11-15, donc ni volume ni s(t) (fiche param-besoin-tension-diabete) ; pas de couverture calculée."
    source: "v2/docs/lab/fiches/param-besoin-tension-diabete.md"
  teleconsultation:
    libelle: Téléconsultation, télésoin
    termes: [teleconsultation, teleconsultations, telesoin, telemedecine]
    raison: "Agit sur l'accès et l'activité, pas sur le nombre de professionnels installés ; non modélisé."
    source: null
  quatrieme_annee_mg:
    libelle: 4e année de l'internat de médecine générale
    termes: [4e annee, quatrieme annee, 4eme annee, medecine generale, generalistes, medecins generalistes]
    raison: "La médecine générale est hors périmètre du projet (brief) ; le jumeau couvre 5 professions non médicales."
    source: null
  medecins_specialistes:
    libelle: Médecins spécialistes
    termes: [specialistes, medecins specialistes, cardiologues, dermatologues, ophtalmologues]
    raison: "Non projetés : amélioration possible, hors plan. Admis seulement comme source d'un transfert de tâches, jamais comme profession projetée ni pour un indice de couverture (règle O2)."
    source: null

# Transferts de tâches calculés par le module de besoin (v2/besoin/transferts.py), 2026-11-15.
# Ils ne changent pas l'effectif (ils restent aussi dans non_modelises) ; ils agissent sur le besoin et l'indice de couverture
# de la cible (règle O2 : la source MG n'a jamais d'indice). L23 seul : L25, L27 et tension/diabète sont non mesurables.
transferts_besoin:
  L23:
    libelle: Les pharmaciens vaccinent davantage contre la grippe (L23)
    termes: [vacciner, vaccination, vaccinations, vaccinent, vaccinant, vaccine]
    source_tache: medecine-generale
    cible: pharmaciens
    t0_defaut: 2026
    statut: "parts par vaccinateur sourcées (Cour des comptes 2026), s(t) mesuré sur la série nationale ; k et m supposés"
    fiche: "v2/docs/lab/fiches/param-besoin-l23-vaccination.md"
    parametre_api: l23

# Transferts de tâches HYPOTHÉTIQUES (2026-11-15, plan v2/docs/lab/derivations/2026-11-15-transfert-hypothetique-plan.md) :
# « X prennent en charge / font p % de <acte> de Y ». Forme de L23, paramètres de l'utilisateur·rice, jamais un levier
# sourcé (aucun volume d'acte ni part du temps publiés en données ouvertes). Cible : l'une des 5 professions ; source :
# MG, spécialistes ou l'une des 5 (O2 : MG et spécialistes en source seulement).
transferts_hypothetiques:
  sources:
    medecine-generale: [medecins generalistes, medecin generaliste, generalistes, generaliste, medecine generale,
                        medecins traitants, medecin traitant]
    specialistes: [medecins specialistes, medecin specialiste, specialistes, specialiste, cardiologues, dermatologues,
                   ophtalmologues]
  libelles_sources: {medecine-generale: médecins généralistes, specialistes: médecins spécialistes}
  # verbes (racines) entre la cible et la part : « prennent (en charge) », « font », « assurent », « réalisent »…
  verbes: [prenn, pren, pris, fai, fon, fer, real, assur, repren, effectu, recuper, ger, absorb, charg]
  # « p % de la demande / du temps de Y » : a = p ; sinon p est la part de l'acte transférée (s∞ = p)
  mots_demande: [demande, activite, temps, travail, charge, patientele]
  balayage_acte: [0.05, 0.10, 0.20]      # a, poids de l'acte dans la demande de la source : inconnu, balayé (supposé)
  balayage_demande: [0.5, 1, 2]          # multiples de a = p quand l'utilisateur·rice donne la part de la demande

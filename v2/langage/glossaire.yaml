    source: null

# Verbes et formules de direction. effet : hausse | baisse | facteur (valeur imposée) | annule.
directions:
  hausse: [augmenter, augmente, augmentant, augmentation, hausse, plus, accroitre, relever, encourager,
           renforcer, reculer, repousser, decaler, prolonger, retarder, davantage, supplementaires,
           supplementaire, ouvrir, elargir, developper, augmentent, augmentons, augmenterait, hausser,
           accroit, accroissement, favoriser, favorise, favorisant, inciter, encourage, soutenir,
           renforce, prolonge, repousse, recule, relevant, faire venir, attirer, accueillir, accueille,
           multiplier, gagner, de plus, en plus]
  baisse: [reduire, reduisant, reduction, baisser, baisse, diminuer, diminution, moins, limiter,
           freiner, restreindre, avancer, reduit, reduite, reduits, reduisons, diminue, diminuant,
           baissant, limite, limitant, couper, freine, de moins, en moins, retirer]
  facteurs:            # formule -> multiplicateur (leviers multiplicateurs)
    doubler: 2.0
    double: 2.0
    deux fois plus: 2.0
    tripler: 3.0
    doublement: 2.0
    triplement: 3.0
    triple: 3.0
    diviser par deux: 0.5
    divise par deux: 0.5
    moitie moins: 0.5
    reduire de moitie: 0.5
    de moitie: 0.5          # avec un verbe de baisse ; « moitié plus » donne 1,5
    moitie plus: 1.5
    supprimer: 0.0
    interdire: 0.0
    zero: 0.0
  racines:             # débuts de mots, toutes conjugaisons
    hausse: [augment, hauss, accroi, relev, renforc, allong, prolong, multipli, repouss, recul, retard, encourag, favoris,
             facilit, assoupl, elarg, etend, grimp, bondi, progress, gonfl, revenir, reviennent]
    baisse: [redui, reduc, baiss, diminu, restrei, raccourc, frein, chut, degringol, rabot, sabr]
  plafonner: [plafonner, plafond, au maximum]   # reconnu, sans valeur chiffrée : signalé
unites:
  pourcent: ["%", pour cent, pourcent, points]
  ans: [an, ans, annee, annees]
  mois: [mois]
  fois: ["x", "×", fois]
